name: Validate MeteoAI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Épinglé pour éviter la bascule automatique d'ubuntu-latest vers Ubuntu 26 (19 oct. 2026) ;
    # à remonter volontairement lors d'une prochaine mise à jour.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
        env:
          CI: 'true'
      - run: pnpm build
      - run: pnpm test:worker
      - run: git diff --exit-code -- pnpm-lock.yaml
